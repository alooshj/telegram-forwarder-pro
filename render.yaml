# Telegram Forwarder Pro — Render Blueprint
# Zero-cost deployment: Free web service + MongoDB Atlas M0
# No credit card required.
#
# IMPORTANT: Render Blueprint spec uses `envVars` (not `env`) for environment variables.
# Secrets (MONGODB_URI, API_HASH, SESSION_STRING) use `sync: false` so their
# values are pulled from the existing Render Dashboard settings and never committed.

services:
  - type: web
    name: telegram-forwarder-pro
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 src.web.api:app
    envVars:
      # MongoDB Atlas connection string — set in Render Dashboard (value hidden here)
      - key: MONGODB_URI
        sync: false
      - key: MONGO_DB
        value: telegram_forwarder
      # Force-fallback is OFF so the app uses MongoDB Atlas (dnspython handles SRV)
      - key: MONGODB_FORCE_FALLBACK
        value: "false"
      - key: API_ID
        value: "39284987"
      - key: API_HASH
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_HOST
        value: "0.0.0.0"
      - key: LOG_LEVEL
        value: INFO
      - key: CHECK_INTERVAL
        value: "30"
      - key: MAX_RETRIES
        value: "3"
      - key: RETRY_DELAY
        value: "10"
    plan: free
    healthCheckPath: /api/status
    autoDeploy: true
