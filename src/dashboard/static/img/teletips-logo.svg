<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="100%" height="100%" fill="none">
  <defs>
    <!-- Cyan Glow Filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <linearGradient id="cyanGlowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>

  <g id="teletips-brand-logo">
    <!-- Letter 1: 'T' with cyan 4-point star -->
    <g transform="translate(10, 20)">
      <!-- Top bar of T -->
      <rect x="0" y="20" width="80" height="20" rx="3" fill="url(#textGrad)" />
      <!-- Vertical stem of T -->
      <rect x="30" y="40" width="20" height="80" rx="3" fill="url(#textGrad)" />
      <!-- Cyan Diamond Star Over T -->
      <g filter="url(#glow-cyan)">
        <!-- 4-point star -->
        <path d="M40 30 Q40 50 20 50 Q40 50 40 70 Q40 50 60 50 Q40 50 40 30 Z" fill="#00f0ff" />
      </g>
      <path d="M40 35 Q40 50 25 50 Q40 50 40 65 Q40 50 55 50 Q40 50 40 35 Z" fill="#ffffff" />
    </g>

    <!-- Letter 2: 'e' with data stream lines -->
    <g transform="translate(105, 20)">
      <path d="M45 42 C20 42 5 60 5 85 C5 110 20 128 50 128 C68 128 80 118 85 105 L66 100 C63 108 56 112 48 112 C34 112 25 102 24 88 L88 88 C88 86 88 82 88 78 C88 56 70 42 45 42 Z M25 74 C27 62 35 56 46 56 C57 56 65 62 67 74 L25 74 Z" fill="url(#textGrad)" />
      <!-- Cyan Data Stream / Code lines inside e -->
      <g filter="url(#soft-glow)">
        <rect x="35" y="80" width="18" height="3" rx="1.5" fill="#00f0ff" />
        <rect x="42" y="86" width="30" height="3" rx="1.5" fill="#00f0ff" />
        <circle cx="28" cy="81.5" r="1.5" fill="#00f0ff" />
        <circle cx="35" cy="87.5" r="1.5" fill="#00f0ff" />
        <line x1="18" y1="84" x2="24" y2="76" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" />
        <line x1="23" y1="84" x2="29" y2="76" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>

    <!-- Letter 3: 'l' -->
    <g transform="translate(205, 20)">
      <rect x="5" y="20" width="20" height="120" rx="3" fill="url(#textGrad)" />
    </g>

    <!-- Letter 4: 'e' -->
    <g transform="translate(240, 20)">
      <path d="M45 42 C20 42 5 60 5 85 C5 110 20 128 50 128 C68 128 80 118 85 105 L66 100 C63 108 56 112 48 112 C34 112 25 102 24 88 L88 88 C88 86 88 82 88 78 C88 56 70 42 45 42 Z M25 74 C27 62 35 56 46 56 C57 56 65 62 67 74 L25 74 Z" fill="url(#textGrad)" />
    </g>

    <!-- Letter 5: 'T' with Particle Dots & Cyan Upward Rocket Arrow -->
    <g transform="translate(340, 20)">
      <!-- Top bar of T -->
      <rect x="0" y="20" width="90" height="20" rx="3" fill="url(#textGrad)" />
      <!-- Dots / Particles on right side of top bar -->
      <circle cx="60" cy="26" r="2" fill="#334155" />
      <circle cx="70" cy="24" r="2.5" fill="#334155" />
      <circle cx="80" cy="27" r="1.8" fill="#334155" />
      <circle cx="65" cy="33" r="2.2" fill="#334155" />
      <circle cx="75" cy="34" r="2" fill="#334155" />
      <circle cx="83" cy="33" r="1.5" fill="#334155" />
      <circle cx="66" cy="12" r="2" fill="#00f0ff" filter="url(#soft-glow)" />
      <circle cx="80" cy="8" r="2.5" fill="#00f0ff" filter="url(#soft-glow)" />
      <circle cx="92" cy="18" r="1.8" fill="#00f0ff" filter="url(#soft-glow)" />

      <!-- Vertical stem of T (hollowed for the arrow) -->
      <path d="M35 40 L35 140 L55 140 L55 40 Z" fill="url(#textGrad)" />

      <!-- Cyan Upward Arrow -->
      <g filter="url(#glow-cyan)">
        <!-- Arrow head -->
        <polygon points="45,52 20,88 37,88 37,138 53,138 53,88 70,88" fill="url(#cyanGlowGrad)" />
      </g>
      <!-- Crisp Arrow top -->
      <polygon points="45,55 24,86 39,86 39,136 51,136 51,86 66,86" fill="#a5f3fc" />
    </g>

    <!-- Letter 6: 'i' with Cyan Hexagon and Node Branch -->
    <g transform="translate(445, 20)">
      <!-- Body of i -->
      <rect x="10" y="55" width="20" height="85" rx="3" fill="url(#textGrad)" />
      <!-- Cyan Hexagon Dot -->
      <g filter="url(#glow-cyan)">
        <!-- Hexagon -->
        <polygon points="20,16 32,23 32,37 20,44 8,37 8,23" fill="#00f0ff" />
      </g>
      <polygon points="20,19 29,24 29,36 20,41 11,36 11,24" fill="#ffffff" />
    </g>

    <!-- Letter 7: 'p' with Circuit Node Connection -->
    <g transform="translate(490, 20)">
      <path d="M10 55 L30 55 L30 68 C36 58 48 52 62 52 C84 52 98 70 98 94 C98 118 84 136 62 136 C48 136 36 130 30 120 L30 170 L10 170 Z M30 94 C30 110 39 120 54 120 C68 120 78 110 78 94 C78 78 68 68 54 68 C39 68 30 78 30 94 Z" fill="url(#textGrad)" />
      <!-- Cyan Connection Branch -->
      <g filter="url(#soft-glow)">
        <line x1="-15" y1="94" x2="10" y2="94" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
        <!-- Node Hexagon inside p -->
        <polygon points="54,80 66,87 66,101 54,108 42,101 42,87" fill="#00f0ff" />
        <polygon points="54,83 63,88 63,100 54,105 45,100 45,88" fill="#083344" />
      </g>
    </g>

    <!-- Letter 8: 's' -->
    <g transform="translate(600, 20)">
      <path d="M50 42 C72 42 85 55 85 72 L65 72 C65 63 58 58 49 58 C38 58 31 63 31 70 C31 77 38 81 53 85 C75 90 87 97 87 112 C87 128 73 138 48 138 C25 138 10 126 10 108 L30 108 C30 118 38 123 50 123 C62 123 68 118 68 111 C68 103 60 99 45 95 C25 90 12 83 12 68 C12 51 27 42 50 42 Z" fill="url(#textGrad)" />
    </g>
  </g>
</svg>